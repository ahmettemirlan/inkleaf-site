<!-- Inkleaf app icon (master vector): a leaf that is also a page, its tip folded over, its
     midrib an ink stroke ending in a drop. Original artwork for Inkleaf; licensed like the
     project (MIT OR Apache-2.0). tool/icons.sh and tool/splash.sh render everything from it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4048d8"/>
      <stop offset="1" stop-color="#1a1d66"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e7d0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a0b33" flood-opacity="0.45"/>
    </filter>
    <filter id="fs" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-4" dy="5" stdDeviation="5" flood-color="#5a4a2a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#sh)"><path d="M123.8 388.2 C269.4 450.8 414.2 287.8 421.6 166.4 L345.6 90.4 C224.2 97.8 61.2 242.6 123.8 388.2 Z" fill="url(#leaf)"/></g>
  <path d="M183.0 329.0 Q225.0 341.3 265.4 334.3 M183.0 329.0 Q170.7 287.0 177.7 246.6 M230.4 281.6 Q276.8 298.4 319.8 294.0 M230.4 281.6 Q213.6 235.2 218.0 192.2 M277.8 234.2 Q319.7 246.6 360.1 239.6 M277.8 234.2 Q265.4 192.3 272.4 151.9 " fill="none" stroke="#1a1d66" stroke-width="10" stroke-linecap="round" opacity="0.38"/>
  <path d="M88.3 423.7 L325.1 186.9" fill="none" stroke="#1a1d66" stroke-width="17" stroke-linecap="round"/>
  <circle cx="325.1" cy="186.9" r="17" fill="#ff6a3d"/>
  <g filter="url(#fs)"><path d="M421.6 166.4 L345.6 90.4 L330.3 181.7 Z" fill="#e2d4b4"/></g>
</svg>
